name: Repository product metadata audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
    paths:
      - "scripts/audit_repository_product_metadata.py"
      - "docs/repository-product-metadata-standard.md"
      - ".github/workflows/product-metadata-audit.yml"

permissions:
  contents: read

concurrency:
  group: product-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit active repositories
        env:
          GITHUB_TOKEN: ${{ secrets.ESTATE_AUDIT_TOKEN || github.token }}
        run: |
          python scripts/audit_repository_product_metadata.py \
            --owner "${{ github.repository_owner }}" \
            --output-dir build/product-metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-product-metadata-audit
          path: build/product-metadata
          if-no-files-found: error
          retention-days: 30
