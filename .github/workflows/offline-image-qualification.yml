name: Offline image qualification

on:
  pull_request:
    paths:
      - .github/workflows/offline-image-qualification.yml
      - .github/workflows/reusable-ai-sec-pipeline.yml
      - security/offline-ai/**
      - privacy/**
      - scripts/build_privacy_wheels.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-image-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image-controls:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CACHE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Select the immutable runtime policy
        id: policy
        run: |
          python -I "$GITHUB_WORKSPACE/security/offline-ai/provision/select_policy.py" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$GITHUB_OUTPUT"
      - name: Prepare verified assets and execute offline controls
        id: qualify
        env:
          POLICY_ROOT: ${{ steps.policy.outputs.path }}
        run: |
          bash -n "$POLICY_ROOT/security/offline-ai/provision/qualify_hosted.sh"
          bash "$POLICY_ROOT/security/offline-ai/provision/qualify_hosted.sh" \
            "$POLICY_ROOT" "$RUNNER_TEMP/offline-runtime"
      - name: Inventory the tested image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker:${{ steps.qualify.outputs.image }}
          format: spdx-json
          syft-version: v1.57.1
          output-file: ${{ runner.temp }}/offline-runtime/evidence/sbom.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"
      - name: Collect image vulnerability evidence for review
        env:
          POLICY_ROOT: ${{ steps.policy.outputs.path }}
          QUALIFIED_IMAGE: ${{ steps.qualify.outputs.image }}
        run: |
          python -I "$POLICY_ROOT/security/offline-ai/provision/collect_vulnerabilities.py" \
            "$QUALIFIED_IMAGE" "$RUNNER_TEMP/offline-runtime/evidence" \
            "$RUNNER_TEMP/offline-grype"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/offline-runtime/evidence/*.json
            ${{ runner.temp }}/offline-runtime/evidence/*.txt
            ${{ runner.temp }}/offline-runtime/evidence/requirements.lock
            ${{ runner.temp }}/offline-runtime/evidence/sbom/
            ${{ runner.temp }}/offline-runtime/evidence/vulnerability/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
