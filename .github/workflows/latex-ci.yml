name: LaTeX CI
on:
  workflow_call:
    inputs:
      root-file:
        type: string
        default: main.tex
      working-directory:
        type: string
        default: "."
      pdf-file:
        type: string
        default: build/main.pdf
      artifact-name:
        type: string
        default: latex-pdf
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          texlive_version: "2026"
          os: debian
          root_file: ${{ inputs.root-file }}
          working_directory: ${{ inputs.working-directory }}
          latexmk_use_lualatex: true
      - name: Validate PDF
        env:
          PDF_FILE: ${{ inputs.pdf-file }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf poppler-utils
          test -s "$PDF_FILE"
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"
          pdftotext "$PDF_FILE" - | grep -q '[^[:space:]]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.pdf-file }}
          if-no-files-found: error
          retention-days: 14
