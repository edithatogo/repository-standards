name: Managed remediation plan

on:
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: Maximum repositories in the bounded plan
        required: true
        default: "25"
      apply:
        description: Reserved for App-gated PR creation; currently plan-only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: managed-remediation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.ESTATE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ESTATE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: edithatogo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Refuse unimplemented write mode
        if: inputs.apply
        run: |
          echo "::error::Write mode remains fail-closed until canary PR creation and rollback are verified."
          exit 2
      - name: Audit current estate
        env:
          ESTATE_AUDIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/audit_estate_conformance.py \
            --registry registry/repositories.json \
            --profiles profiles/archetype-profiles.json \
            --managed-files managed-files/manifest.json \
            --output-dir remediation-output
      - name: Simulate and plan
        run: |
          python scripts/simulate_policy_impact.py \
            --audit remediation-output/estate-conformance.json \
            --profiles profiles/archetype-profiles.json \
            --output remediation-output/policy-impact.json
          python scripts/plan_managed_remediation.py \
            --audit remediation-output/estate-conformance.json \
            --output remediation-output/managed-remediation-plan.json \
            --limit "${{ inputs.candidate_limit }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: managed-remediation-plan-${{ github.run_id }}
          path: remediation-output/
          retention-days: 30
