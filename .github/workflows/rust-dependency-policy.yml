name: Reusable Rust dependency policy
on:
  workflow_call:
    inputs:
      manifest-path:
        description: Path to the Cargo.toml for this workspace
        required: false
        type: string
        default: ./Cargo.toml
      rust-version:
        description: Cargo toolchain for dependency graph resolution
        required: false
        type: string
        default: stable
permissions:
  contents: read
jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          rust-version: ${{ inputs.rust-version }}
          manifest-path: ${{ inputs.manifest-path }}
          command: check
          arguments: --all-features
