name: Tree-sitter provenance probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify the published wheel and pinned tree-sitter source
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/tree-sitter-provenance"
          mkdir -p "$workspace/source" "$workspace/compiler"
          curl --fail --silent --show-error --location --proto '=https' --max-time 90 \
            'https://files.pythonhosted.org/packages/f2/13/0d4dc8d124794105f300082c46e3d8ad45eac7af63113b57a5966629b5a3/semgrep-1.185.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl' \
            -o "$workspace/semgrep.whl"
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            'https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.26.3.tar.gz' \
            -o "$workspace/tree-sitter.tar.gz"
          cd "$workspace"
          sha256sum -c <<'HASHES'
          0eb6aaadad5b957af96d1300487e10af1dc8016e8ef53072effb48cd4906c02b  semgrep.whl
          7f4a7cf0a2cd217444063fe2a4d800bc9d21ed609badc2ac20c0841d67166550  tree-sitter.tar.gz
          HASHES
          unzip -p semgrep.whl 'semgrep-1.185.0.data/purelib/semgrep/bin/libs/libtree-sitter.so.0.26' > shipped.so
          test -s shipped.so
          tar -xzf tree-sitter.tar.gz --strip-components=1 -C source
          cat > compiler/Dockerfile <<'DOCKERFILE'
          FROM docker.io/library/almalinux@sha256:26342666bbc10e84acdc9dda31fd2d6bb7fd9bfc88ad523278b178ae5ce5794a
          RUN printf '%s\n' \
              '[source-baseos]' \
              'name=AlmaLinux 9.8 BaseOS' \
              'baseurl=https://vault.almalinux.org/9.8/BaseOS/x86_64/os/' \
              'gpgcheck=1' 'repo_gpgcheck=1' \
              'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9' \
              '[source-appstream]' \
              'name=AlmaLinux 9.8 AppStream' \
              'baseurl=https://vault.almalinux.org/9.8/AppStream/x86_64/os/' \
              'gpgcheck=1' 'repo_gpgcheck=1' \
              'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9' \
              > /etc/yum.repos.d/exact-source.repo \
            && dnf -y --disablerepo='*' --enablerepo='source-*' \
              install gcc-11.5.0-14.el9.alma.1 make \
            && dnf clean all
          DOCKERFILE
          docker build --platform linux/amd64 --tag localhost/tree-sitter-provenance:probe compiler
      - name: Build tree-sitter without network access and compare ELF sections
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/tree-sitter-provenance"
          cd "$workspace"
          docker run --rm --pull=never --network none --cap-drop ALL \
            --security-opt no-new-privileges --read-only --tmpfs /tmp \
            --user "$(id -u):$(id -g)" --cpus 2 \
            --mount "type=bind,src=$workspace/source,dst=/source" \
            localhost/tree-sitter-provenance:probe \
              bash -euc 'gcc --version | head -n 1; make --no-print-directory -s -j2 -C /source libtree-sitter.so'
          readelf -n shipped.so source/libtree-sitter.so | sed -n '/^File:/p; /Build ID:/p'
          for section in text rodata; do
            objcopy --dump-section ".$section=shipped.$section" shipped.so
            objcopy --dump-section ".$section=rebuilt.$section" source/libtree-sitter.so
            sha256sum "shipped.$section" "rebuilt.$section"
            cmp "shipped.$section" "rebuilt.$section"
          done
          id() { readelf -n "$1" | sed -n 's/.*Build ID: //p'; }
          test "$(id shipped.so)" = 1af4135835d9a1eaa40da0892167e5773173b0a2
          test "$(id shipped.so)" = "$(id source/libtree-sitter.so)"
