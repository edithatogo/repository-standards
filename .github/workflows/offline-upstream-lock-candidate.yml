name: Updated Semgrep library probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/repository-standards
          ref: 8b9b3c2d62e79af4b2592ae7b1e630ef895e0be3
          persist-credentials: false
          path: policy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/innovate
          ref: 12c58c52ca2caed38ad54b93e562c5c0f9a1d4a2
          persist-credentials: false
          fetch-depth: 0
          path: consumer
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.2'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.100.0'
          components: rustfmt
      - name: Stage the verified native payloads
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          [[ "$(git -C policy rev-parse HEAD)" = 8b9b3c2d62e79af4b2592ae7b1e630ef895e0be3 ]]
          [[ "$(git -C consumer rev-parse HEAD)" = 12c58c52ca2caed38ad54b93e562c5c0f9a1d4a2 ]]
          if ! command -v bsdtar >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y --no-install-recommends libarchive-tools
          fi
          trial="$RUNNER_TEMP/semgrep-updated-libraries"
          python -I -B policy/security/offline-ai/provision/probe_semgrep_rust.py --prepare "$trial"
          python -I -B inputs/security/offline-ai/provision/stage_semgrep_library_probe.py "$trial/libs" "$(command -v bsdtar)"
          mkdir "$RUNNER_TEMP/trial-runtime"
          cat > "$RUNNER_TEMP/trial-runtime/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/library/python@sha256:fd2aef5e0d8438208de9fe154ab5b331a2428fc0c9838d41611e611fd7a80d85
          RUN apt-get update && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build --platform linux/amd64 --tag localhost/semgrep-library-probe:trial "$RUNNER_TEMP/trial-runtime"
      - name: Check scanner coverage and Rust syntax with networking disabled
        shell: bash
        run: |
          set -euo pipefail
          trial="$RUNNER_TEMP/semgrep-updated-libraries"
          rustfmt="$(rustup which --toolchain 1.100.0 rustfmt)"
          rust_toolchain="${rustfmt%/bin/rustfmt}"
          [[ "$("$rust_toolchain/bin/rustc" --version)" = 'rustc 1.100.0 '* ]]
          docker image inspect --format '{{.Id}}' localhost/semgrep-library-probe:trial
          docker run --rm --pull=never --entrypoint=/bin/bash \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 8g --cpus 4 --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,size=2g,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/consumer,dst=/work,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/policy,dst=/policy,readonly" \
            --mount "type=bind,src=$trial,dst=/candidate,readonly" \
            --mount "type=bind,src=$rust_toolchain,dst=/rust-toolchain,readonly" \
            -e HOME=/tmp -e TMPDIR=/tmp localhost/semgrep-library-probe:trial -euc '
              dependencies="$(LD_TRACE_LOADED_OBJECTS=1 /candidate/semgrep-core)"
              for library in libm.so.6 libresolv.so.2 libcurl.so.4 libgcc_s.so.1 libstdc++.so.6 libssl.so.3 libcrypto.so.3 liblzma.so.5; do
                grep -F -- "=> /candidate/libs/$library " <<< "$dependencies"
              done
              exec /usr/local/bin/python -I -B /policy/security/offline-ai/provision/probe_semgrep_rust.py \
                --probe /candidate/semgrep-core /rust-toolchain/bin/rustfmt /work
            '
