name: Offline upstream lock candidate

on:
  pull_request:
    paths:
      - .github/workflows/offline-upstream-lock-candidate.yml
      - security/offline-ai/provision/**
      - privacy/requirements.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-lock-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Resolve public metadata into an unreviewed candidate
        run: |
          python security/offline-ai/provision/resolve_candidate.py \
            --destination "$RUNNER_TEMP/offline-lock-candidate"
      - name: Preserve public lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-upstream-lock-candidate
          path: ${{ runner.temp }}/offline-lock-candidate
          if-no-files-found: error
          retention-days: 7

  gitleaks-candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.2'
      - name: Build an unreviewed Gitleaks dependency candidate
        run: |
          python -I security/offline-ai/provision/gitleaks_candidate.py \
            --destination "$RUNNER_TEMP/offline-gitleaks-candidate"
      - name: Preserve public Gitleaks candidate metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-gitleaks-candidate
          path: |
            ${{ runner.temp }}/offline-gitleaks-candidate/candidate-receipt.json
            ${{ runner.temp }}/offline-gitleaks-candidate/go.mod
            ${{ runner.temp }}/offline-gitleaks-candidate/go.sum
            ${{ runner.temp }}/offline-gitleaks-candidate/modules.json
            ${{ runner.temp }}/offline-gitleaks-candidate/module-closure.json
            ${{ runner.temp }}/offline-gitleaks-candidate/gitleaks-LICENSE.txt
          if-no-files-found: warn
          retention-days: 7
