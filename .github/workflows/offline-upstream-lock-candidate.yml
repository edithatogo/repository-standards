name: Inspect pinned Python base package dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect removable packages in the immutable base
        shell: bash
        run: |
          set -euo pipefail
          base=docker.io/library/python@sha256:fd2aef5e0d8438208de9fe154ab5b331a2428fc0c9838d41611e611fd7a80d85
          docker pull --platform linux/amd64 "$base"
          docker run --rm --pull=never --network none "$base" bash -s <<'BASH'
          set -euo pipefail
          python --version
          dpkg-query -W -f='${binary:Package} ${Version} essential=${Essential} protected=${Protected}\n' \
            libsqlite3-0 libncursesw6 ncurses-base ncurses-bin libtinfo6 login libuuid1
          for package in libsqlite3-0 libncursesw6 ncurses-base ncurses-bin libtinfo6 login libuuid1; do
            if dpkg --dry-run --purge "$package"; then
              printf 'Package purge is dependency-compatible %s\n' "$package"
            else
              printf 'Package purge is blocked %s\n' "$package"
            fi
          done
          BASH
