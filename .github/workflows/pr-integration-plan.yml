name: Pull request integration plan

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: pr-integration-plan
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'
      - name: Run focused checks
        run: PYTHONPATH=scripts python -m unittest discover -s tests -p test_pr_integration_plan.py -v
      - name: Observe open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 101 \
            --json number,isDraft,isCrossRepository,baseRefName,baseRefOid,headRefOid,labels,reviewDecision,mergeable,mergeStateStatus,statusCheckRollup \
            > "$RUNNER_TEMP/pr-observations.json"
      - name: Produce advisory plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python scripts/pr_integration_plan.py \
            --input "$RUNNER_TEMP/pr-observations.json" \
            --output "$RUNNER_TEMP/pr-integration-plan.json" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-integration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-integration-plan.json
          retention-days: 30
          if-no-files-found: error
