name: Offline AI security (four layers)
on:
  workflow_call:
    inputs:
      enforce_ai:
        type: boolean
        required: false
        default: false
      github_hosted:
        type: boolean
        required: false
        default: false
      runner_label:
        type: string
        required: false
        default: ai-security-offline
      verify_scanner_model:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ${{ inputs.github_hosted && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64",{0}]', toJSON(inputs.runner_label))) }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CACHE: "1"
    steps:
      - name: Check the hosted review scope
        if: inputs.github_hosted
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/innovate
          case "$EVENT_NAME" in
            pull_request|push|workflow_dispatch) ;;
            *) exit 2 ;;
          esac
      - name: Checkout consumer without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.github_hosted && (github.event.pull_request.head.sha || github.sha) || '' }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          path: consumer
      - name: Checkout central security policy without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/repository-standards
          # Immutable snapshot containing the offline scanner rules and replay controls.
          ref: 9870ef0e6aeafae448e42ca7b67189b260f988d1
          persist-credentials: false
          submodules: false
          path: policy
      - name: Verify isolated execution preconditions
        if: "!inputs.github_hosted"
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          test -n "${SECURITY_IMAGE_DIGEST:-}" || { echo 'Runner must preconfigure SECURITY_IMAGE_DIGEST (sha256:...)'; exit 2; }
          [[ "$SECURITY_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 2
          image="localhost/offline-ai-security@${SECURITY_IMAGE_DIGEST}"
          docker image inspect "$image" >/dev/null
          [[ "${SECURITY_IMAGE_EVIDENCE:-}" = /* ]] || { echo 'Runner must preconfigure an absolute SECURITY_IMAGE_EVIDENCE directory'; exit 2; }
          python -I -c 'import sys; assert sys.version_info[:3] == (3, 15, 2)'
          review="$(mktemp -d "$RUNNER_TEMP/offline-image-review.XXXXXXXX")"
          mkdir "$review/vulnerability"
          install -m 600 "$SECURITY_IMAGE_EVIDENCE/vulnerability/receipt.json" "$review/vulnerability/"
          install -m 600 "$SECURITY_IMAGE_EVIDENCE/vulnerability/grype.json" "$review/vulnerability/"
          python -I "$GITHUB_WORKSPACE/policy/security/offline-ai/provision/review_wolfi_image.py" "$image" "$review"
          echo 'Installed scanner image passed the all-layer vulnerability and backport review'
      - name: Run 4 layers in a network-disabled container
        if: "!inputs.github_hosted"
        shell: bash
        env:
          ENFORCE_AI: ${{ inputs.enforce_ai }}
          VERIFY_SCANNER_MODEL: ${{ inputs.verify_scanner_model }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          docker run --rm --pull=never --entrypoint=bash --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 8g --cpus 4 --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE/consumer",dst=/work,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/policy",dst=/policy,readonly \
            -e ENFORCE_AI -e VERIFY_SCANNER_MODEL -e EVENT_NAME -e BASE_SHA -e HOME=/tmp \
            -e SECURITY_ASSET_MANIFEST=/opt/offline-ai/manifest.json -e GLINER_MODEL_DIR=/opt/models/gliner-pii \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e HF_DATASETS_OFFLINE=1 \
            -e HF_HOME=/opt/models -e XDG_CACHE_HOME=/tmp/cache -e TMPDIR=/tmp \
            -e HF_HUB_DISABLE_TELEMETRY=1 -e PIP_NO_INDEX=1 -e npm_config_offline=true \
            -e PROMPTFOO_CONFIG_DIR=/tmp/promptfoo -e PROMPTFOO_DISABLE_TELEMETRY=1 -e PROMPTFOO_DISABLE_UPDATE=1 \
            -e PROMPTFOO_DISABLE_REMOTE_GENERATION=true \
            -e PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION=true \
            -e PROMPTFOO_DISABLE_SHARING=1 -e PROMPTFOO_SELF_HOSTED=1 \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONSAFEPATH=1 -e PYTEST_ADDOPTS=-p\ no:cacheprovider \
            "localhost/offline-ai-security@${SECURITY_IMAGE_DIGEST}" \
            /policy/security/offline-ai/run.sh
      - if: inputs.github_hosted
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15.2"
      - if: inputs.github_hosted
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
      - if: inputs.github_hosted
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - if: inputs.github_hosted
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Verify the hosted source and runtime
        if: inputs.github_hosted
        id: hosted_source
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C consumer rev-parse HEAD)" = "$TARGET_SHA"
          case "$EVENT_NAME" in
            pull_request|push)
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              if [[ "$EVENT_NAME" != push || "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
                git -C consumer cat-file -e "$BASE_SHA^{commit}"
              fi
              ;;
            workflow_dispatch) test -z "$BASE_SHA" ;;
          esac
          uv venv "$GITHUB_WORKSPACE/.venv-offline" --python 3.15.2
          repo_python="$GITHUB_WORKSPACE/.venv-offline/bin/python"
          "$repo_python" -I -c 'import sys; assert sys.version_info[:3] == (3, 15, 2)'
          "$repo_python" -I -m ensurepip
          "$repo_python" -I -m pip --version
          printf '%s\n' "$GITHUB_WORKSPACE/.venv-offline/bin" >> "$GITHUB_PATH"
          printf 'sha=%s\n' "$(git -C policy rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and exercise the candidate image
        if: inputs.github_hosted
        id: prepare
        shell: bash
        env:
          POLICY_ROOT: ${{ github.workspace }}/policy
        run: |
          bash -n "$POLICY_ROOT/security/offline-ai/provision/qualify_hosted.sh"
          bash "$POLICY_ROOT/security/offline-ai/provision/qualify_hosted.sh" \
            "$POLICY_ROOT" "$RUNNER_TEMP/offline-runtime" --gitleaks-reviewed-build
      - name: Export the immutable consumer policy
        if: inputs.github_hosted
        id: consumer_policy
        shell: bash
        env:
          POLICY_ROOT: ${{ github.workspace }}/policy
          POLICY_SHA: ${{ steps.hosted_source.outputs.sha }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/innovate44-consumer-policy"
          python -I "$POLICY_ROOT/security/offline-ai/provision/export_consumer_policy.py" \
            --commit "$POLICY_SHA" --destination "$destination"
          echo "path=$destination" >> "$GITHUB_OUTPUT"
      - name: Prepare the locked hosted SAST assets
        if: inputs.github_hosted
        id: sast_assets
        shell: bash
        env:
          CONSUMER_POLICY: ${{ steps.consumer_policy.outputs.path }}
        run: |
          set -euo pipefail
          umask 022
          if ! command -v bsdtar >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y --no-install-recommends libarchive-tools
          fi
          trial="$RUNNER_TEMP/hosted-sast"
          rustfmt="$(rustup which --toolchain 1.100.0 rustfmt)"
          [[ "$rustfmt" = */1.100.0-x86_64-unknown-linux-gnu/bin/rustfmt ]]
          rust_toolchain="${rustfmt%/bin/rustfmt}"
          [[ "$("$rust_toolchain/bin/rustc" --version)" = 'rustc 1.100.0 '* ]]
          python -I -B "$CONSUMER_POLICY/security/offline-ai/provision/hosted_sast_assets.py" \
            "$trial" "$(command -v bsdtar)" > "$RUNNER_TEMP/offline-runtime/evidence/hosted-sast-assets.json"
          printf 'bundle=%s\nrust_toolchain=%s\n' "$trial" "$rust_toolchain" >> "$GITHUB_OUTPUT"
      - name: Scan the Innovate source without container networking
        if: inputs.github_hosted
        id: consumer
        shell: bash
        env:
          ENFORCE_AI: ${{ inputs.enforce_ai }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CONSUMER_POLICY: ${{ steps.consumer_policy.outputs.path }}
          CANDIDATE_IMAGE: ${{ steps.prepare.outputs.image }}
          HOSTED_SAST: ${{ steps.sast_assets.outputs.bundle }}
          RUST_TOOLCHAIN: ${{ steps.sast_assets.outputs.rust_toolchain }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_IMAGE" =~ ^localhost/offline-ai-security@sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$CANDIDATE_IMAGE" >/dev/null
          docker run --rm --pull=never --entrypoint=bash --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 8g --cpus 4 --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,size=2g,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/consumer,dst=/work,readonly" \
            --mount "type=bind,src=$CONSUMER_POLICY,dst=/policy,readonly" \
            --mount "type=bind,src=$HOSTED_SAST,dst=/hosted-sast,readonly" \
            --mount "type=bind,src=$RUST_TOOLCHAIN,dst=/rust-toolchain,readonly" \
            -e ENFORCE_AI -e EVENT_NAME -e BASE_SHA -e HOME=/tmp \
            -e SECURITY_ASSET_MANIFEST=/opt/offline-ai/manifest.json -e GLINER_MODEL_DIR=/opt/models/gliner-pii \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e HF_DATASETS_OFFLINE=1 \
            -e HF_HOME=/opt/models -e XDG_CACHE_HOME=/tmp/cache -e TMPDIR=/tmp \
            -e HF_HUB_DISABLE_TELEMETRY=1 -e PIP_NO_INDEX=1 -e npm_config_offline=true \
            -e PROMPTFOO_CONFIG_DIR=/tmp/promptfoo -e PROMPTFOO_DISABLE_TELEMETRY=1 -e PROMPTFOO_DISABLE_UPDATE=1 \
            -e PROMPTFOO_DISABLE_REMOTE_GENERATION=true -e PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION=true \
            -e PROMPTFOO_DISABLE_SHARING=1 -e PROMPTFOO_SELF_HOSTED=1 \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONSAFEPATH=1 -e PYTEST_ADDOPTS=-p\ no:cacheprovider \
            "$CANDIDATE_IMAGE" -c '
              set -euo pipefail
              python -I -c "import errno,socket; s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(2); code=s.connect_ex((\"192.0.2.1\",443)); s.close(); assert code in (errno.ENETUNREACH,errno.EHOSTUNREACH), \"outbound probe was not denied\""
              echo "Outbound IPv4 probe denied"
              exec bash /policy/security/offline-ai/run.sh --hosted-sast
            '
      - name: Inventory the tested image
        if: always() && inputs.github_hosted && steps.prepare.outcome == 'success'
        shell: bash
        env:
          POLICY_ROOT: ${{ github.workspace }}/policy
          CANDIDATE_IMAGE: ${{ steps.prepare.outputs.image }}
        run: |
          python -I "$POLICY_ROOT/security/offline-ai/provision/collect_sbom.py" \
            "$CANDIDATE_IMAGE" "$RUNNER_TEMP/offline-runtime/evidence" "$RUNNER_TEMP/offline-syft"
      - name: Collect image vulnerability evidence for review
        id: vulnerability
        if: always() && inputs.github_hosted && steps.prepare.outcome == 'success'
        shell: bash
        env:
          POLICY_ROOT: ${{ github.workspace }}/policy
          CANDIDATE_IMAGE: ${{ steps.prepare.outputs.image }}
        run: |
          python -I "$POLICY_ROOT/security/offline-ai/provision/collect_vulnerabilities.py" \
            "$CANDIDATE_IMAGE" "$RUNNER_TEMP/offline-runtime/evidence" "$RUNNER_TEMP/offline-grype"
      - name: Enforce the Wolfi vulnerability review
        if: always() && inputs.github_hosted && steps.vulnerability.outcome == 'success'
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.prepare.outputs.image }}
        run: |
          python -I "$GITHUB_WORKSPACE/policy/security/offline-ai/provision/review_wolfi_image.py" \
            "$CANDIDATE_IMAGE" "$RUNNER_TEMP/offline-runtime/evidence"
      - name: Retain hosted offline evidence
        if: always() && inputs.github_hosted
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-offline-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/offline-runtime/evidence/*.json
            ${{ runner.temp }}/offline-runtime/evidence/*.txt
            ${{ runner.temp }}/offline-runtime/evidence/requirements.lock
            ${{ runner.temp }}/offline-runtime/evidence/sbom/
            ${{ runner.temp }}/offline-runtime/evidence/vulnerability/
          if-no-files-found: warn
          retention-days: 14
