name: Estate conformance

on:
  pull_request:
    paths:
      - ".github/workflows/estate-conformance.yml"
      - "managed-files/**"
      - "profiles/**"
      - "registry/**"
      - "schemas/**"
      - "scripts/audit_estate_conformance.py"
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5445ce83e3 # v7
      - uses: actions/setup-python@a3eaf2bcd76e5fd05e4ebd3e3960002094e02ac8 # v7
        with:
          python-version: "3.14"
      - name: Validate policy files
        run: |
          python -m json.tool profiles/archetype-profiles.json >/dev/null
          python -m json.tool registry/repositories.json >/dev/null
          python -m json.tool schemas/repository-entry.schema.json >/dev/null
          python -m json.tool schemas/verification-receipt.schema.json >/dev/null
          python -m py_compile scripts/audit_estate_conformance.py

  reconcile-estate:
    if: github.event_name != 'pull_request'
    needs: validate-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      ESTATE_AUDIT_TOKEN: ${{ secrets.ESTATE_AUDIT_TOKEN }}
      ISSUE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5445ce83e3 # v7
      - uses: actions/setup-python@a3eaf2bcd76e5fd05e4ebd3e3960002094e02ac8 # v7
        with:
          python-version: "3.14"
      - name: Require an estate-readable token
        run: |
          if [ -z "${ESTATE_AUDIT_TOKEN:-}" ]; then
            echo "::error::Configure ESTATE_AUDIT_TOKEN with read access to all in-scope repositories."
            exit 2
          fi
      - name: Audit and reconcile the control issue
        run: |
          python scripts/audit_estate_conformance.py \
            --registry registry/repositories.json \
            --profiles profiles/archetype-profiles.json \
            --managed-files managed-files/manifest.json \
            --output-dir conformance-output \
            --issue-repository "${{ github.repository }}" \
            --issue-number "${{ vars.CONFORMANCE_ISSUE_NUMBER || '16' }}"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v7
        if: always()
        with:
          name: estate-conformance-${{ github.run_id }}
          path: conformance-output/
          retention-days: 30
