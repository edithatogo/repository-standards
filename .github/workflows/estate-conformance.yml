name: Estate conformance

on:
  pull_request:
    paths:
      - ".github/workflows/estate-conformance.yml"
      - "managed-files/**"
      - "profiles/**"
      - "registry/**"
      - "schemas/**"
      - "scripts/audit_estate_conformance.py"
      - "scripts/estate_evidence.py"
      - "scripts/publish_estate_evidence.py"
      - "tests/*evidence*.py"
      - "tooling/estate-evidence-requirements.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/estate-conformance.yml"
      - "scripts/estate_evidence.py"
      - "scripts/publish_estate_evidence.py"
      - "schemas/estate-evidence*.json"
      - "tooling/estate-evidence-requirements.txt"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-conformance-${{ github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.2"
      - name: Install hash-verified schema tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tooling/estate-evidence-requirements.txt
      - name: Validate policy and adversarial evidence fixtures
        run: |
          python -m json.tool profiles/archetype-profiles.json >/dev/null
          python -m json.tool registry/repositories.json >/dev/null
          python -m json.tool schemas/repository-entry.schema.json >/dev/null
          python -m json.tool schemas/verification-receipt.schema.json >/dev/null
          python -m json.tool registry/canaries.json >/dev/null
          python -m json.tool schemas/estate-evidence.schema.json >/dev/null
          python -m json.tool schemas/estate-evidence-public.schema.json >/dev/null
          python -m compileall -q scripts tests
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_*.py' -v
          PYTHONPATH=scripts:tests python tests/evidence_schema_acceptance.py -v

  reconcile-estate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.2"
      - name: Install hash-verified schema tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tooling/estate-evidence-requirements.txt
      - name: Collect and validate live evidence
        env:
          ESTATE_AUDIT_TOKEN: ${{ secrets.ESTATE_AUDIT_TOKEN }}
        run: |
          umask 077
          python -I scripts/estate_evidence.py \
            --private-output "$RUNNER_TEMP/f01-private/estate-evidence.json" \
            --public-dir "$RUNNER_TEMP/f01-public" \
            --registry registry/repositories.json
      - name: Attest public aggregates only
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/f01-public/estate-evidence.json
      - name: Upload aggregate-only receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/f01-public/estate-evidence.json
            ${{ runner.temp }}/f01-public/estate-evidence.md
            ${{ runner.temp }}/f01-public/CHECKSUMS.sha256
          if-no-files-found: warn
          retention-days: 90
      - name: Remove ephemeral private evidence
        if: always()
        run: rm -f -- "$RUNNER_TEMP/f01-private/estate-evidence.json"

  publish-aggregate:
    needs: reconcile-estate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.2"
      - name: Install hash-verified schema tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tooling/estate-evidence-requirements.txt
      - name: Download only this run's public receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh run download "$RUN_ID" \
            --name "estate-evidence-$RUN_ID-$RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/f01-public"
      - name: Reconcile the existing aggregate issue section
        env:
          ISSUE_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ vars.CONFORMANCE_ISSUE_NUMBER || '16' }}
        run: |
          python -I scripts/publish_estate_evidence.py \
            --report "$RUNNER_TEMP/f01-public/estate-evidence.json" \
            --issue-number "$ISSUE_NUMBER"
