rules:
  - id: offline-python-raw-to-egress
    languages: [python]
    severity: ERROR
    message: "Untrusted data may reach network, agent, tool output or logging without sanitization"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: os.getenv(...)
          - pattern: os.environ[$K]
          - pattern: input(...)
          - pattern: open(...).read(...)
          - pattern: $F.read(...)
          - pattern: $C.fetchall(...)
          - pattern: $C.fetchone(...)
          - pattern: $R.json(...)
          - pattern: $R.text
          - pattern: $REQ.body
          - pattern: $REQ.POST
          - pattern: $REQ.GET
    # Only fully qualified, reviewed sanitizer interfaces are trusted.
    # Imported aliases and repository-defined lookalikes are NOT trusted.
    pattern-sanitizers:
      - pattern-either:
          - pattern: security.local_dlp.redact_sensitive_data(...)
          - pattern: security.local_dlp.sanitize_context(...)
    pattern-sinks:
      - pattern-either:
          - pattern: requests.post(...)
          - pattern: httpx.post(...)
          - pattern: $CLIENT.post(...)
          - pattern: $AGENT.invoke(...)
          - pattern: $LLM.invoke(...)
          - pattern: $LLM.generate(...)
          - pattern: print(...)
          - pattern: $LOGGER.info(...)
          - pattern: $LOGGER.error(...)
  - id: offline-ts-raw-to-egress
    languages: [javascript, typescript]
    severity: ERROR
    message: "Untrusted data may reach network, agents or logging"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: process.env.$K
          - pattern: req.body
          - pattern: $REQ.query
          - pattern: $FS.readFileSync(...)
          - pattern: $DB.query(...)
          - pattern: $R.json()
    # No TypeScript sanitizer is whitelisted until its implementation is qualified.
    pattern-sinks:
      - pattern-either:
          - pattern: fetch(...)
          - pattern: axios.post(...)
          - pattern: $CLIENT.post(...)
          - pattern: $AGENT.invoke(...)
          - pattern: console.log(...)
          - pattern: $LOGGER.error(...)
  # Opengrep's Rust AST keeps qualified expressions inside a macro as tokens.
  # Restrict token matching to these logging macros and skip strings and comments.
  - id: offline-rust-direct-env-log
    languages: [rust]
    severity: ERROR
    message: Do not log raw environment secrets
    patterns:
      - pattern-either:
          - pattern: println!(...)
          - pattern: eprintln!(...)
          - pattern: std::println!(...)
          - pattern: std::eprintln!(...)
      - pattern-regex: >-
          (?x)
          (?(DEFINE)
            (?<line> //[^\r\n]* )
            (?<block> /\* (?: (?&block) | (?! /\* | \*/ ) [\s\S] )* \*/ )
            (?<gap> (?:\s+|(?&line)|(?&block))* )
          )
          (?:
            r(?<hashes>\#*)"(?s:.*?)"\k<hashes>
            | "(?:\\.|[^"\\])*"
            | (?&line)
            | (?&block)
          )(*SKIP)(*F)
          |
          \bstd(?&gap)::(?&gap)env(?&gap)::(?&gap)var(?:_os)?(?&gap)\(
  - id: offline-rust-env-log-taint
    languages: [rust]
    severity: ERROR
    message: Do not log raw environment secrets
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: std::env::var(...)
          - pattern: std::env::var_os(...)
    pattern-sinks:
      - pattern-either:
          - pattern: println!(...)
          - pattern: eprintln!(...)
          - pattern: std::println!(...)
          - pattern: std::eprintln!(...)
  - id: offline-rust-env-http
    languages: [rust]
    severity: ERROR
    message: "Do not send raw environment secrets to a network client"
    pattern-either:
      - pattern: $CLIENT.body(std::env::var($KEY))
      - pattern: $CLIENT.post(std::env::var($KEY))
